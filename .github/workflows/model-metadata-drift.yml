name: Model Metadata Drift

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 2"

permissions:
  contents: read

concurrency:
  group: model-metadata-drift-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: keel

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: keel/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: keel/package.json
          cache: pnpm
          cache-dependency-path: keel/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Run model metadata drift check
        run: |
          set +e
          pnpm check:model-metadata > model-metadata-drift.txt 2>&1
          status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error title=Actionable model metadata drift::Open the job summary for details."
          elif [ "$status" -eq 2 ]; then
            echo "::warning title=Model metadata source failure::models.dev could not be checked; open the job summary for details."
          fi
          {
            echo "## Model Metadata Drift"
            echo
            echo '```text'
            cat model-metadata-drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat model-metadata-drift.txt
          exit "$status"
