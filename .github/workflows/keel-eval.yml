name: Keel Eval

on:
  workflow_dispatch:
    inputs:
      trials:
        description: Number of trials per task
        required: true
        default: "1"
        type: string
      task:
        description: Optional task id to run
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: keel-eval-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: keel

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: keel/package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: keel/package.json
          cache: pnpm
          cache-dependency-path: keel/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm eval:check

      - name: Run real eval
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVAL_TRIALS: ${{ inputs.trials }}
          EVAL_TASK: ${{ inputs.task }}
        run: |
          mkdir -p evals/results
          out="evals/results/keel-eval-${GITHUB_RUN_ID}.jsonl"
          echo "EVAL_RESULTS=$out" >> "$GITHUB_ENV"

          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY repository secret is required." >&2
            exit 1
          fi

          args=(eval --trials "$EVAL_TRIALS" --out "$out")
          if [ -n "$EVAL_TASK" ]; then
            args+=(--task "$EVAL_TASK")
          fi

          node --experimental-strip-types src/cli/index.ts "${args[@]}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: keel-eval-results
          path: keel/${{ env.EVAL_RESULTS }}
          if-no-files-found: ignore
