name: Keel Eval

on:
  workflow_dispatch:
    inputs:
      trials:
        description: Number of trials per task
        required: true
        default: "1"
        type: string
      task:
        description: Optional task id to run
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: keel-eval-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: keel

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EVAL_RESULTS: evals/results/keel-eval-${{ github.run_id }}.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: keel/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: keel/package.json
          cache: pnpm
          cache-dependency-path: keel/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm eval:check

      - run: pnpm build

      - name: Run real eval
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVAL_TRIALS: ${{ inputs.trials }}
          EVAL_TASK: ${{ inputs.task }}
        run: |
          mkdir -p evals/results

          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY repository secret is required." >&2
            exit 1
          fi

          if ! [[ "$EVAL_TRIALS" =~ ^[1-9][0-9]*$ ]]; then
            echo "trials must be a positive integer." >&2
            exit 1
          fi

          args=(eval --trials "$EVAL_TRIALS" --out "$EVAL_RESULTS")
          if [ -n "$EVAL_TASK" ]; then
            args+=(--task "$EVAL_TASK")
          fi

          node dist/cli/index.js "${args[@]}"

      - name: Summarize eval results
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { evalResultLineSchema } from "./dist/eval/result-schema.js";

          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          if (!summaryPath) process.exit(0);

          const resultPath = process.env.EVAL_RESULTS;
          const lines = [];
          lines.push("## Keel Eval");
          lines.push("");

          if (!resultPath || !fs.existsSync(resultPath)) {
            lines.push("No eval result file was produced.");
            fs.appendFileSync(summaryPath, `${lines.join("\n")}\n`);
            process.exit(0);
          }

          const rows = fs
            .readFileSync(resultPath, "utf8")
            .trim()
            .split("\n")
            .filter(Boolean)
            .map((line) => evalResultLineSchema.parse(JSON.parse(line)));

          const requiredRows = rows.filter((row) => row.requiredToPass);
          const gatePassed = (row) =>
            row.pass &&
            (row.delegationSelection === undefined ||
              (row.delegationSelection.status === "observed" &&
                row.delegationSelection.satisfied));
          const passed = requiredRows.filter(gatePassed).length;
          const harnessFailures = rows.filter(
            (row) => row.harnessOutcome !== "completed",
          ).length;
          const selectionFailures = requiredRows.filter(
            (row) =>
              row.delegationSelection !== undefined &&
              !(
                row.delegationSelection.status === "observed" &&
                row.delegationSelection.satisfied
              ),
          ).length;
          const totalCost = rows.reduce(
            (sum, row) => sum + (row.report?.costUsd ?? 0),
            0,
          );
          const totalTurns = rows.reduce(
            (sum, row) => sum + (row.report?.agentLoopTurns ?? 0),
            0,
          );
          const totalTokens = rows.reduce(
            (sum, row) =>
              sum +
              (row.report?.usage?.inputTokens ?? 0) +
              (row.report?.usage?.outputTokens ?? 0),
            0,
          );

          lines.push(`Result file: \`${resultPath}\``);
          lines.push("");
          lines.push(`- Required gates passed: ${passed}/${requiredRows.length}`);
          lines.push(`- Harness failures: ${harnessFailures}`);
          lines.push(`- Selection failures: ${selectionFailures}`);
          if (harnessFailures > 0) {
            lines.push(`- **Harness failures require investigation**; see \`${resultPath}\`.`);
          }
          lines.push(`- Reported turns: ${totalTurns}`);
          lines.push(`- Reported tokens: ${totalTokens}`);
          lines.push(`- Reported cost: $${totalCost.toFixed(6)}`);
          lines.push("");
          lines.push("| Task | Trial | Condition | Gate | Outcome | Turns | Tokens | Cost |");
          lines.push("|---|---:|---|---|---|---:|---:|---:|");

          for (const row of rows) {
            const tokens =
              (row.report?.usage?.inputTokens ?? 0) +
              (row.report?.usage?.outputTokens ?? 0);
            const cost = row.report?.costUsd ?? 0;
            const outcome =
              row.harnessOutcome === "completed"
                ? row.taskOutcome
                : row.harnessOutcome;
            lines.push(
              `| ${row.taskId} | ${row.trial} | ${row.condition} | ${row.requiredToPass ? (gatePassed(row) ? "pass" : "fail") : "observe"} | ${outcome} | ${row.report?.agentLoopTurns ?? ""} | ${tokens || ""} | ${cost ? `$${cost.toFixed(6)}` : ""} |`,
            );
          }

          fs.appendFileSync(summaryPath, `${lines.join("\n")}\n`);
          NODE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: keel-eval-results
          path: keel/${{ env.EVAL_RESULTS }}
          if-no-files-found: ignore
          retention-days: 90
