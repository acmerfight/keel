name: CI

# No path filter: this workflow is a required status check, so it must report
# on every PR. A path-filtered workflow that never runs leaves the required
# check pending forever and blocks unrelated PRs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: keel

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: keel/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: keel/package.json
          cache: pnpm
          cache-dependency-path: keel/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm eval:check

      - run: pnpm knip

  macos:
    name: macos test
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: keel/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: keel/package.json
          cache: pnpm
          cache-dependency-path: keel/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  coverage-shard:
    name: coverage shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/4
            artifact: vitest-coverage-1
          - shard: 2/4
            artifact: vitest-coverage-2
          - shard: 3/4
            artifact: vitest-coverage-3
          - shard: 4/4
            artifact: vitest-coverage-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: keel/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: keel/package.json
          cache: pnpm
          cache-dependency-path: keel/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:emit

      - run: rm -rf .vitest-reports coverage

      - run: pnpm test:coverage:shard
        env:
          KEEL_TEST_CLI_ENTRY: dist
          VITEST_SHARD: ${{ matrix.shard }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: keel/.vitest-reports/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: coverage-shard
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: keel/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: keel/package.json
          cache: pnpm
          cache-dependency-path: keel/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-coverage-*
          path: keel/.vitest-reports
          merge-multiple: true

      - run: pnpm test:coverage:merge

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: keel/coverage/lcov.info
          fail_ci_if_error: true
          use_oidc: true

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, coverage, macos]
    if: ${{ always() }}
    defaults:
      run:
        working-directory: .
    steps:
      - run: |
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
          test "${{ needs.macos.result }}" = "success"
