name: CI

on:
  push:
    branches: [main]
    paths:
      - keel/**
      - "!keel/**/*.md"
  pull_request:
    paths:
      - keel/**
      - "!keel/**/*.md"

defaults:
  run:
    working-directory: keel

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: keel/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: keel/package.json
          cache: pnpm
          cache-dependency-path: keel/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test:coverage

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: keel/coverage/lcov.info
          fail_ci_if_error: false

      - run: pnpm knip
