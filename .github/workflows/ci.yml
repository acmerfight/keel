name: CI

on:
  push:
    branches: [main]
    paths: [keel/**]
  pull_request:
    paths: [keel/**]

defaults:
  run:
    working-directory: keel

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: keel/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: keel/package.json
          cache: pnpm
          cache-dependency-path: keel/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm knip
