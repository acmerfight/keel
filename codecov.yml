# keel's coverage fluctuates run-to-run because bash.ts exercises
# timing-dependent kill/timeout paths (SIGTERM->SIGKILL fallback, abort
# races). Project coverage can also shift when a PR makes previously
# subprocess-only modules visible to lcov, changing Codecov's denominator.
# This threshold absorbs that reporting-scope movement; real regressions are
# still caught by the vitest coverage thresholds (statements 95, branches 90)
# and codecov/patch. Patch coverage is explicit at 90% so Codecov does not
# infer a stricter auto target when a PR expands the reported coverage scope.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 3%
    patch:
      default:
        target: 90%
